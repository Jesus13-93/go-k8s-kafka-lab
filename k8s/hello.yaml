apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: hello
          image: hello-server:v4
          args: ["-grpc.listen-address=:45001", "-max-conn-age=10s", "-work=5ms"]
          ports:
            - name: grpc
              containerPort: 45001
            - name: metrics
              containerPort: 2112
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            tcpSocket:
              port: 45001
            periodSeconds: 2
          resources:
            requests: { cpu: 50m, memory: 32Mi}
            limits: { cpu: 1, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  labels:
    app: hello
spec:
  selector:
    app: hello
  ports:
    - name: grpc
      port: 45001
    - name: metrics
      port: 2112

---
apiVersion: v1
kind: Service
metadata:
  name: hello-headless
spec:
  clusterIP: None
  selector:
    app: hello
  ports:
    - port: 45001
