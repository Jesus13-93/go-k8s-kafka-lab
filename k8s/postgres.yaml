apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: kafka
stringData:            # stringData — можно писать открытым текстом, k8s сам закодирует в base64
  POSTGRES_USER: app
  POSTGRES_PASSWORD: app
  POSTGRES_DB: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:17
          envFrom:
            - secretRef: {name: postgres}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "app"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kafka
spec:
  selector: {app: postgres}
  ports:
    - port: 5432