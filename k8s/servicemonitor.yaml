apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hello
  labels:
    release: monitoring   # ← Prometheus из чарта подхватывает только мониторы с этой меткой
spec:
  selector:
    matchLabels:
      app: hello          # выбирает Service по его меткам, не поды
  endpoints:
    - port: metrics       # имя порта в Service
      interval: 15s